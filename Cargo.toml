[workspace]
# Build helper for `cargo dist-windows` / `cargo debug-windows`.
members = ["xtask"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MPL-2.0"
authors = ["touchHLE project contributors"]
homepage = "https://touchhle.org/"

[package]
name = "touchHLE"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }

[lib]
# https://users.rust-lang.org/t/making-both-binary-and-cdylib-from-one-package/29105
crate-type = ["cdylib", "rlib"]

[[bin]]
# Not "touchHLE": on Windows the lib's cdylib (touchHLE.dll, only needed for
# the Android .so) and the bin would both write touchHLE.pdb, which Cargo
# warns about (rust-lang/cargo#6313). Renaming the lib instead would change
# the module_path!() prefix on every log line and the Android library name.
# `cargo dist-windows` ships this as S.S.Encore.exe.
name = "touchHLE_bin"
path = "src/bin.rs"

[features]
default = ["static"]
static = ["sdl2/bundled", "sdl2/static-link", "touchHLE_openal_soft_wrapper/static"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
cc = "1.0.83"
cmake = "0.1.49"
gl_generator = "0.14.0"

[dependencies]
hound = "3.5.0"
mach_object = "0.1.17"
plist = "1.8.0"
zip = { version = "0.6.4", default-features = false, features = ["deflate"] }
rusttype = "0.9.3"
# While most Symphonia codecs are (likely) unpatented/have freely licenseable 
# patents as of 2024, all of the AAC profiles except AAC-LC (likely) have 
# active patent claims. The "aac" feature only enables AAC-LC, so it's should 
# be ok.
# (The above statements should not understood as legal claims/advice.)
symphonia = { version = "0.6.0-alpha.1", default-features = false, features = [
    # formats
    "caf", "isomp4", "wav",
    # codecs
    "aac", "adpcm", "alac", "mp3", "pcm"
] }
quick-xml = "0.38.4"
digest = "0.10.7"
md-5 = "0.10.6"
sha1 = "0.10.6"
encoding_rs = "0.8.35"
# We currently use a fork of rust-sdl2 because we need a fix for Android builds
# that's not upstream yet.
# The HIDAPI feature is enabled because rust-sdl2 hides the SDL2 sensor features
# behind this, but the actual HIDAPI is not used by touchHLE (see window.rs).
# Note that the submodule in vendor/SDL2/ must use exactly the same revision of
# SDL2 that rust-sdl2 uses, so that the Android JNI interface matches.
sdl2 = { git = "https://github.com/touchHLE/rust-sdl2", tag = "touchHLE-3", features = ["hidapi"] }
sdl2-sys = { git = "https://github.com/touchHLE/rust-sdl2", tag = "touchHLE-3" }
touchHLE_dynarmic_wrapper = { path = "src/cpu/dynarmic_wrapper" }
touchHLE_gl_bindings = { path = "src/gles/gl_bindings" }
touchHLE_openal_soft_wrapper = { path = "src/audio/openal_soft_wrapper" }
touchHLE_pvrt_decompress_wrapper = { path = "src/image/pvrt_decompress_wrapper" }
touchHLE_stb_image_wrapper = { path = "src/image/stb_image_wrapper" }
touchHLE_version = { path = "src/version" }
windows-sys = { version = "0.61.0", features = ["Win32_System_Memory", "Win32_System_Time"] }
nibarchive = "0.1.0"
libc = "0.2.180"
corosensei = "0.3.2"
uuid = { version = "1.2.2", default-features = false, features = ["v4"] }
# zlib compression for the PNG cover-art cache the desktop music scanner
# writes (src/media/artwork.rs). zip already depends on it.
flate2 = "1.0.25"

# The desktop music scanner (src/media/scan_windows.rs). Android scans with
# the Storage Access Framework in Kotlin instead (LibraryScanner.kt), so
# neither crate is built there.
[target.'cfg(not(target_os = "android"))'.dependencies]
# Song tags and embedded cover art (ID3v2, iTunes M4A, RIFF INFO).
lofty = { version = "0.21", default-features = false }
# The native "Select folder" dialog for choosing the music folder.
rfd = { version = "0.15.4", default-features = false }

# Android: songs picked with the Storage Access Framework are content://
# URIs, so the engine asks Kotlin (MusicFiles.openFd) for a file descriptor
# over JNI (src/media/source.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }

[build-dependencies]
cargo-license = "0.5.1"
cc = { workspace = true }
cmake = { workspace = true }
gl_generator = { workspace = true }

# Unoptimized, touchHLE is too slow to play, and scanning a music library
# spends minutes decoding and resizing cover art. So debug builds
# (`cargo debug-windows`, `cargo test`) still optimize, while keeping
# debug info, debug assertions and overflow checks for backtraces:
# - touchHLE and its in-tree wrapper crates lightly (level 1 still steps
#   sensibly in a debugger). This also reaches the C/C++ they build: cc
#   passes it on as -O1, and CMake builds dynarmic (the CPU emulator) and
#   OpenAL Soft as RelWithDebInfo instead of Debug.
# - Third-party crates fully (flate2, lofty, ...), since nobody debugs
#   into them. They're compiled once, so it only slows the first build.
# Release builds and the Android APK (always release Rust) are unaffected.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
